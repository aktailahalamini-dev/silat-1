<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Score Seni — ATSC IV</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/scoreboard.css"><link rel="stylesheet" href="css/seni.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body class="sb-page">
<div class="arena-bg" aria-hidden="true"></div>
<div class="sb">
  <header class="sb-head">
    <span class="logo-slot" data-label="L"><img src="assets/logos/logo-left.png" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span>
    <div class="sb-title"><strong>AR-RANIRY TAPAK SUCI CHAMPIONSHIP IV</strong><span>TINGKAT PROVINSI ACEH</span><em id="arenaTag"></em></div>
    <span class="logo-slot" data-label="L"><img src="assets/logos/logo-right.png" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span>
  </header>
  <main class="sn-main">
    <div class="sn-row">
      <div class="sn-who"><b id="snNama">—</b><span id="snKont"></span></div>
      <div class="sn-mid"><div class="timer" id="snTimer">00:00</div><div class="status" id="snStatus"></div></div>
      <div class="sn-cat" id="snKat">KATEGORI SENI</div>
    </div>
    <div class="sn-panels" id="snPanels"></div>
    <div class="sn-total"><span>TOTAL KESELURUHAN <small id="snPen"></small></span><b id="snTotal">0</b></div>
  </main>
  <footer class="sb-foot"><span>Menjunjung Tinggi Sportivitas, Integritas, dan Prestasi.</span><a href="index.html">Menu</a><button class="btn btn-ghost" id="fsBtn" type="button">Layar penuh</button></footer>
</div>
<script src="js/seni-data.js"></script><script src="js/app.js"></script><script src="js/seni-live.js"></script>
</body>
</html>
