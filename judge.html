<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juri — ATSC IV</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body class="judge-page">
<header id="topbar" class="topbar"></header>
<main class="j-wrap">
  <div class="j-head">
    <div class="j-box"><small>PARTAI</small><b id="jPartai">—</b><span id="jKat"></span></div>
    <div class="j-mid"><b id="jWho">JURI</b><div class="timer" id="jTimer">00:00</div><span class="status" id="jStatus"></span></div>
    <div class="j-box"><small>BABAK</small><b id="jBabak">—</b><span id="jUrut"></span></div>
  </div>
  <p class="notice" id="jNotice" hidden></p>
  <div class="j-sides">
    <div id="redSide"></div><div id="blueSide"></div>
  </div>
  <div class="j-send">
    <div><span class="sub-lbl">Status:</span> <b id="jSent" class="badge">Belum ada input</b>
      <span class="sub-lbl">Input terakhir:</span> <b id="jTime">—</b></div>
    <small class="muted">Setiap ketukan langsung tersimpan. Poin tampil di Live Score setelah minimal 2 juri menekan nilai yang sama.</small>
  </div>
</main>
<script src="js/arena-data.js"></script><script src="js/timer.js"></script><script src="js/auth-demo.js"></script><script src="js/results.js"></script><script src="js/app.js"></script><script src="js/judge.js"></script>
</body>
</html>
